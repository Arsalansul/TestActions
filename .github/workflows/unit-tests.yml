name: Unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - stage
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  UNITY_PATH: C:\Program Files\Unity\Hub\Editor\6000.3.6f1\Editor\Unity.exe

jobs:
  test:
    name: Tests (${{ matrix.key }})
    runs-on: [self-hosted, windows, unity]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Один редактор Unity на машину за раз: оба режима делят workspace и Library.
      max-parallel: 1
      matrix:
        include:
          - key: editmode
            platform: EditMode
          - key: playmode
            platform: PlayMode
    steps:
      # clean: false обязателен — git clean -ffdx снёс бы Library (она в .gitignore),
      # а тёплая Library и есть причина, по которой прогон на своей машине быстрый.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
          clean: false

      - name: Run ${{ matrix.platform }} tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'artifacts\${{ matrix.key }}'
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $results = Join-Path $artifacts 'results.xml'
          $log = Join-Path $artifacts 'unity.log'
          $project = Join-Path $env:GITHUB_WORKSPACE 'My project'

          if (-not (Test-Path $env:UNITY_PATH)) {
            Write-Host "::error::Unity не найден: $env:UNITY_PATH"
            exit 1
          }

          # Unity.exe — GUI-приложение, оператор & его НЕ ждёт: вернул бы 0 сразу после
          # запуска, шаг бы закрылся, а раннер убил бы Unity на середине импорта проекта.
          # Дождаться завершения можно только через Start-Process -Wait.
          $unityArgs = @(
            '-batchmode',
            '-runTests',
            '-projectPath', "`"$project`"",
            '-testPlatform', '${{ matrix.platform }}',
            '-testResults', "`"$results`"",
            '-logFile', "`"$log`""
          )
          $proc = Start-Process -FilePath $env:UNITY_PATH -ArgumentList $unityArgs -NoNewWindow -Wait -PassThru
          $code = $proc.ExitCode

          if (Test-Path $log) {
            Write-Host "--- последние 200 строк Unity.log ---"
            Get-Content $log -Tail 200
          }

          # Страховка от «тихого зелёного»: код 0 без файла результатов означает,
          # что Unity не дошёл до тестов, а не что они прошли.
          if (-not (Test-Path $results)) {
            Write-Host "::error::Unity не создал файл результатов: $results"
            if ($code -eq 0) { $code = 1 }
          }

          # 0 — все тесты прошли, 2 — есть упавшие (отчёт всё равно нужен), остальное — сбой прогона.
          Write-Host "Unity exit code: $code"
          exit $code

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.key }}
          path: artifacts/${{ matrix.key }}
          if-no-files-found: warn

  report:
    name: Report to PR
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-results-*
          path: artifacts

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const MARKER = '<!-- unity-unit-tests-report -->';
            const jobsResult = '${{ needs.test.result }}';
            const root = 'artifacts';

            function findXml(dir) {
              const out = [];
              if (!fs.existsSync(dir)) return out;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) out.push(...findXml(full));
                else if (entry.name.toLowerCase().endsWith('.xml')) out.push(full);
              }
              return out;
            }

            function attrs(tag) {
              const map = {};
              const re = /([\w-]+)="([^"]*)"/g;
              let m;
              while ((m = re.exec(tag)) !== null) map[m[1]] = m[2];
              return map;
            }

            function unescapeXml(s) {
              return String(s)
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/&quot;/g, '"')
                .replace(/&apos;/g, "'")
                .replace(/&amp;/g, '&');
            }

            function text(block, tagName) {
              const m = new RegExp('<' + tagName + '>([\\s\\S]*?)</' + tagName + '>').exec(block);
              if (!m) return '';
              const raw = m[1].replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1');
              return unescapeXml(raw).trim();
            }

            // Сводка прогона + все упавшие кейсы из одного NUnit3-файла результатов.
            function parseResults(xml) {
              const runTag = /<test-run\b[^>]*>/.exec(xml);
              const a = runTag ? attrs(runTag[0]) : {};
              const summary = {
                result: a.result || 'Unknown',
                total: Number(a.total || 0),
                passed: Number(a.passed || 0),
                failed: Number(a.failed || 0),
                skipped: Number(a.skipped || 0) + Number(a.inconclusive || 0),
                duration: Number(a.duration || 0),
              };

              const failures = [];
              const caseRe = /<test-case\b([^>]*?)(\/?)>/g;
              let m;
              while ((m = caseRe.exec(xml)) !== null) {
                const ca = attrs(m[1]);
                if (ca.result !== 'Failed' || m[2] === '/') continue;
                const end = xml.indexOf('</test-case>', caseRe.lastIndex);
                const body = end === -1 ? '' : xml.slice(caseRe.lastIndex, end);
                failures.push({
                  name: ca.fullname || ca.name || '(unnamed)',
                  message: text(body, 'message'),
                  stack: text(body, 'stack-trace'),
                });
              }
              return { summary, failures };
            }

            const modes = ['editmode', 'playmode'];
            const rows = [];
            const failureSections = [];
            const totals = { total: 0, passed: 0, failed: 0, skipped: 0 };
            let anyResults = false;

            for (const mode of modes) {
              const files = findXml(path.join(root, 'test-results-' + mode));
              if (files.length === 0) {
                rows.push('| ' + mode + ' | ⚠️ Нет результатов | – | – | – | – | – |');
                continue;
              }
              anyResults = true;
              for (const file of files) {
                const parsed = parseResults(fs.readFileSync(file, 'utf8'));
                const s = parsed.summary;
                totals.total += s.total;
                totals.passed += s.passed;
                totals.failed += s.failed;
                totals.skipped += s.skipped;

                const icon = s.failed > 0
                  ? '❌ Failed'
                  : (s.result === 'Passed' ? '✅ Passed' : '⚠️ ' + s.result);
                rows.push('| ' + mode + ' | ' + icon + ' | ' + s.total + ' | ' + s.passed + ' | ' + s.failed + ' | ' + s.skipped + ' | ' + s.duration.toFixed(1) + 's |');

                for (const f of parsed.failures) {
                  const details = [f.message, f.stack].filter(Boolean).join('\n\n').slice(0, 3000);
                  failureSections.push(
                    '<details><summary>❌ <code>' + f.name + '</code> (' + mode + ')</summary>\n\n```\n' + details + '\n```\n\n</details>'
                  );
                }
              }
            }

            const overall = totals.failed > 0
              ? '❌ Тесты упали'
              : (!anyResults || jobsResult !== 'success' ? '⚠️ Прогон завершился с ошибкой' : '✅ Все тесты прошли');

            let body = [
              MARKER,
              '## 🧪 Unit tests — ' + overall,
              '',
              '| Mode | Result | Total | ✅ Passed | ❌ Failed | ⏭️ Skipped | ⏱️ Duration |',
              '| --- | --- | ---: | ---: | ---: | ---: | ---: |',
            ].concat(rows).concat([
              '',
              '**Итого:** ' + totals.passed + '/' + totals.total + ' прошло, ' + totals.failed + ' упало, ' + totals.skipped + ' пропущено.',
              '',
            ]).join('\n');

            if (failureSections.length > 0) {
              body += ['### Упавшие тесты', ''].concat(failureSections).concat(['']).join('\n');
            }

            if (!anyResults) {
              body += '\nФайлы результатов не найдены — скорее всего прогон упал до запуска тестов. Подробности в логах джобы.\n';
            }

            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            body += '\n---\nКоммит `' + sha + '` · [Лог прогона](' + runUrl + ')';

            if (body.length > 65000) {
              body = body.slice(0, 64800) + '\n\n_…отчёт обрезан, подробности в логах прогона._';
            }

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

            await core.summary.addRaw(body.replace(MARKER, '')).write();

            if (totals.failed > 0 || jobsResult !== 'success') {
              core.setFailed('Unit tests failed — см. комментарий в PR.');
            }
