name: Sync GitHub Issues to TestIT

on:
 issues:
   types: [opened]

permissions:
 issues: write
 contents: read

jobs:
 sync-to-testit:
   runs-on: ubuntu-latest
   steps:
     - name: Create Test Case in TestIT
       uses: actions/github-script@v7
       env:
         TESTIT_URL: ${{ secrets.TESTIT_URL }}
         TESTIT_API_KEY: ${{ secrets.TESTIT_API_KEY }}
         TESTIT_PROJECT_ID: ${{ secrets.TESTIT_PROJECT_ID }}
         TESTIT_SECTION_ID: ${{ secrets.TESTIT_SECTION_ID }}
       with:
         github-token: ${{ secrets.GITHUB_TOKEN }}
         script: |
           const issue = context.payload.issue;
           const labels = (issue.labels || []).map(l => String(l.name || '').toLowerCase());

           if (!labels.includes('testit')) {
             core.info('No "testit" label, skip.');
             return;
           }

           const body = String(issue.body || '');
           const lines = body.split('\n').map(s => s.trim());

           let mode = '';
           const repro = [];
           const expected = [];

           for (const line of lines) {
             const low = line.toLowerCase();

             if (low.includes('to reproduce')) {
               mode = 'repro';
               continue;
             }

             if (low.includes('expected behavior')) {
               mode = 'expected';
               continue;
             }

             if (
               low.includes('screenshots') ||
               low.includes('desktop') ||
               low.includes('additional context')
             ) {
               mode = '';
               continue;
             }

             if (!line) continue;

             if (mode === 'repro') repro.push(line);
             if (mode === 'expected') expected.push(line);
           }

           const expectedText = expected.join(' ').trim();
           const steps = [];

           for (const line of repro) {
             const cleaned = line.replace(/^[0-9]+\.\s*/, '');
             if (!cleaned) continue;
             steps.push({
               action: cleaned,
               expected: expectedText || 'Шаг выполнен без ошибок'
             });
           }

           if (steps.length === 0) {
             steps.push({
               action: 'Проверка по описанию issue',
               expected: expectedText || 'Баг воспроизводится'
             });
           }

           const payload = {
             entityTypeName: 'TestCases',
             name: String(issue.title || 'GitHub Issue'),
             projectId: process.env.TESTIT_PROJECT_ID,
             sectionId: process.env.TESTIT_SECTION_ID,
             state: 'Ready',
             priority: 'Medium',
             duration: 60,
             precondition: 'Issue создан в GitHub и помечен label bug.',
             postcondition: 'Проверка завершена.',
             description: `GitHub Issue #${issue.number}\n${issue.html_url}\n${body}`,
             steps: steps
           };

           const url = `${process.env.TESTIT_URL}/api/v2/workItems`;

           const resp = await fetch(url, {
             method: 'POST',
             headers: {
               'accept': 'application/json',
               'content-type': 'application/json',
               'authorization': `PrivateToken ${process.env.TESTIT_API_KEY}`
             },
             body: JSON.stringify(payload)
           });

           const text = await resp.text();
           core.info(`TestIT status: ${resp.status}`);
           core.info(`TestIT response: ${text}`);

           if (!resp.ok) {
             core.setFailed(`TestIT API error ${resp.status}: ${text}`);
             return;
           }

           let createdId = '';
           try {
             const json = JSON.parse(text);
             createdId = json.id || '';
           } catch (e) {
             core.info('Cannot parse response JSON id.');
           }

           const comment = createdId
             ? `✅ Тест-кейс создан в TestIT: ${createdId}`
             : '✅ Тест-кейс создан в TestIT.';

           await github.rest.issues.createComment({
             owner: context.repo.owner,
             repo: context.repo.repo,
             issue_number: issue.number,
             body: comment
           });
