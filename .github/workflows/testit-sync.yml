name: Sync GitHub Issues to TestIT

on:
  issues:
    types: [opened]

jobs:
  sync-to-testit:
    runs-on: ubuntu-latest
    steps:
      - name: Create test case in TestIT
        env:
          TESTIT_API_KEY: ${{ secrets.TESTIT_API_KEY }}
          TESTIT_PROJECT_ID: ${{ secrets.TESTIT_PROJECT_ID }}
          TESTIT_TEST_SUITE_ID: ${{ secrets.TESTIT_TEST_SUITE_ID }}
        run: |
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"

          # Парсим через grep/sed
          NAME=$(echo "$ISSUE_BODY" | awk '/\*\*Describe the bug\*\*/{found=1; next} /\*\*/{found=0} found && NF{print}' | head -c 200)
          STEPS=$(echo "$ISSUE_BODY" | awk '/\*\*To Reproduce\*\*/{found=1; next} /\*\*/{found=0} found && NF{print}')
          EXPECTED=$(echo "$ISSUE_BODY" | awk '/\*\*Expected behavior\*\*/{found=1; next} /\*\*/{found=0} found && NF{print}')

          if [ -z "$NAME" ]; then
            NAME="$ISSUE_TITLE"
            STEPS=""
            EXPECTED=""
          fi

          # Экранируем для JSON
          ESCAPED_BODY=$(echo "$ISSUE_BODY" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g' | tr '\n' ' ')
          ESCAPED_NAME=$(echo "$NAME" | sed 's/\\/\\\\/g; s/"/\\"/g' | tr '\n' ' ')
          ESCAPED_STEPS=$(echo "$STEPS" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g' | tr '\n' ' ')
          ESCAPED_EXPECTED=$(echo "$EXPECTED" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g' | tr '\n' ' ')

          echo "Creating test case: $ESCAPED_NAME"

          # Создаём тест-кейс в TestIT (свой инстанс!)
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://team-cyqh.testit.software/api/v2/testcases" \
            -H "Authorization: Bearer $TESTIT_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"projectId\": $TESTIT_PROJECT_ID,
              \"testSuiteId\": \"$TESTIT_TEST_SUITE_ID\",
              \"name\": \"$ESCAPED_NAME\",
              \"description\": \"$ESCAPED_BODY\",
              \"steps\": \"$ESCAPED_STEPS\",
              \"expectedResult\": \"$ESCAPED_EXPECTED\"
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "TestIT Response: $BODY"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "API Error: HTTP $HTTP_CODE"
           echo "$BODY"
            exit 1
          fi

          # Извлекаем ID
          TESTCASE_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -z "$TESTCASE_ID" ]; then
            echo "Failed to extract test case ID. Response: $BODY"
            exit 1
          fi

          echo "Test case created with ID: $TESTCASE_ID"

          # Привязываем GitHub Issue
          curl -s -X POST "https://team-cyqh.testit.software/api/v2/links" \
            -H "Authorization: Bearer $TESTIT_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"testCaseId\": \"$TESTCASE_ID\",
              \"externalId\": \"$ISSUE_NUMBER\",
              \"externalSystem\": \"github\"
            }"

          # Комментарий в issue
          curl -s -X POST \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"✅ Тест-кейс создан в TestIT (ID: $TESTCASE_ID)\"}"
