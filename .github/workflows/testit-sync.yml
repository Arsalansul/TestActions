name: Sync GitHub Issues to TestIT

on:
 issues:
   types: [opened]

permissions:
 issues: write
 contents: read

jobs:
 sync-to-testit:
   runs-on: ubuntu-latest

   steps:
     - name: Create Test Case in TestIT
       uses: actions/github-script@v7
       env:
         TESTIT_URL: ${{ secrets.TESTIT_URL }}
         TESTIT_API_KEY: ${{ secrets.TESTIT_API_KEY }}
         TESTIT_PROJECT_ID: ${{ secrets.TESTIT_PROJECT_ID }}
         TESTIT_SECTION_ID: ${{ secrets.TESTIT_SECTION_ID }}
       with:
         github-token: ${{ secrets.GITHUB_TOKEN }}
         script: |
           const issue = context.payload.issue;

           const labels = (issue.labels || []).map(function (l) {
             return (l.name || '').toLowerCase();
           });

           if (!labels.includes('bug')) {
             core.info('Label bug не найден, пропускаю.');
             return;
           }

           const body = issue.body || '';
           const lines = body.split('\n').map(function (s) { return s.trim(); });

           function extractSection(startMarker, stopMarkers) {
             let collecting = false;
             const result = [];

             for (const rawLine of lines) {
               const line = rawLine.trim();
               const lower = line.toLowerCase();

               if (!collecting && lower.includes(startMarker.toLowerCase())) {
                 collecting = true;
                 continue;
               }

               if (collecting && stopMarkers.some(function (m) { return lower.includes(m.toLowerCase()); })) {
                 break;
               }

               if (collecting && line.length > 0) {
                 result.push(line);
               }
             }

             return result;
           }

           const reproduceBlock = extractSection('to reproduce', [
             'expected behavior',
             'screenshots',
             'desktop',
             'additional context'
           ]);

           const expectedBlock = extractSection('expected behavior', [
             'screenshots',
             'desktop',
             'additional context'
           ]);

           const reproduceSteps = reproduceBlock
             .filter(function (line) { return /^\d+\./.test(line); })
             .map(function (line) { return line.replace(/^\d+\.\s*/, '); });

           const expectedText = expectedBlock.join(' ').trim();

           const steps = reproduceSteps.length > 0
             ? reproduceSteps.map(function (s) {
                 return {
                   action: s,
                   expected: expectedText || 'Шаг выполнен без ошибок'
                 };
               })
             : [{
                 action: 'Открыть issue и выполнить проверку по описанию',
                 expected: expectedText || 'Баг воспроизводится'
               }];

           const payload = {
             entityTypeName: 'TestCases',
             name: issue.title,
             projectId: process.env.TESTIT_PROJECT_ID,
             sectionId: process.env.TESTIT_SECTION_ID,
             state: 'Ready',
             priority: 'Medium',
             duration: 60,
             precondition: 'Issue создан в GitHub и помечен label bug.',
             postcondition: 'Проверка завершена.',
             description: 'GitHub Issue #' + issue.number + '\n' + issue.html_url + '\n' + body,
             steps: steps
           };

           const url = process.env.TESTIT_URL + '/api/v2/workItems';
           core.info('POST ' + url);

           const resp = await fetch(url, {
             method: 'POST',
             headers: {
               accept: 'application/json',
               'content-type': 'application/json',
               authorization: 'PrivateToken ' + process.env.TESTIT_API_KEY
             },
             body: JSON.stringify(payload)
           });

           const text = await resp.text();
           core.info('TestIT status: ' + resp.status);
           core.info('TestIT response: ' + text);

           if (!resp.ok) {
             core.setFailed('TestIT API error ' + resp.status + ': ' + text);
             return;
           }

           let createdId = '';
           try {
             const json = JSON.parse(text);
             createdId = json.id || '';
           } catch (e) {
             core.info('Ответ не JSON или без id.');
           }

           const commentBody = createdId
             ? '✅ Тест-кейс создан в TestIT: ' + createdId
             : '✅ Тест-кейс создан в TestIT.';

           await github.rest.issues.createComment({
             owner: context.repo.owner,
             repo: context.repo,
             issue_number: issue.number,
             body: commentBody
           });
